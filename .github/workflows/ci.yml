name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            xcode: /Applications/Xcode_26.3.app
          - runner: macos-26
            xcode: /Applications/Xcode_26.5.app
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s '${{ matrix.xcode }}'
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Release packaging contract
        run: Tests/ReleasePackagingTests/package_bridge_release_contract_test.sh
      - name: Watch destination contract
        run: Tests/CIContractTests/watch_destination_contract_test.sh
      - name: Watch UI evidence contract
        run: Tests/CIContractTests/watch_ui_evidence_contract_test.sh
      - name: Swift package test process contract
        run: Tests/CIContractTests/swift_package_test_process_contract_test.sh
      - name: Swift package tests
        run: Scripts/run-swift-package-tests.sh
      - name: Bridge production smoke (latest macOS)
        if: matrix.runner == 'macos-26'
        run: Scripts/run-watch-bridge-smoke.sh
      - name: Build and verify ad-hoc release package (latest macOS)
        if: matrix.runner == 'macos-26'
        run: |
          release_output="$RUNNER_TEMP/codex-watch-release"
          Scripts/package-bridge-release.sh \
            --output "$release_output" \
            --sign-identity -
          cd "$release_output"
          shasum -a 256 -c SHA256SUMS
          ! unzip -Z1 VoiceInboxBridge-*.zip | grep -q '^__MACOSX/'

  watch-build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app
      - name: Resolve deterministic Watch destination
        id: watch-destination
        run: Scripts/resolve-watch-simulator-destination.sh
      - name: Run Watch app tests
        run: |
          xcodebuild \
            -project CodexWatch.xcodeproj \
            -scheme CodexWatch \
            -configuration Debug \
            -destination "platform=watchOS Simulator,id=${{ steps.watch-destination.outputs.destination_id }}" \
            CODE_SIGNING_ALLOWED=NO \
            test
