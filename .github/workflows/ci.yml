name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            xcode: /Applications/Xcode_26.3.app
          - runner: macos-26
            xcode: /Applications/Xcode_26.5.app
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s '${{ matrix.xcode }}'
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Release packaging contract
        run: Tests/ReleasePackagingTests/package_bridge_release_contract_test.sh
      - name: Swift package tests
        run: swift test --no-parallel
      - name: Bridge production smoke (latest macOS)
        if: matrix.runner == 'macos-26'
        run: Scripts/run-watch-bridge-smoke.sh

  watch-build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app
      - name: Run Watch app tests
        run: |
          destination_id="$(xcrun simctl list devices available | awk -F '[()]' '/Apple Watch/ {print $2; exit}')"
          test -n "$destination_id"
          xcodebuild \
            -project CodexWatch.xcodeproj \
            -scheme CodexWatch \
            -configuration Debug \
            -destination "platform=watchOS Simulator,id=$destination_id" \
            CODE_SIGNING_ALLOWED=NO \
            test
